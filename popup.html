<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mercor Result Inspector</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111318;
        --panel: #1a1d24;
        --border: #2a2f3a;
        --fg: #e6e8ee;
        --muted: #8b93a7;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --ok: #22c55e;
        --err: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 420px;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      header h1 { margin: 0; font-size: 14px; font-weight: 600; }
      #page { font-size: 11px; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      main { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
        padding: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; }
      textarea {
        width: 100%;
        height: 220px;
        resize: vertical;
        padding: 8px;
        font: 11px/1.4 ui-monospace, Consolas, "Courier New", monospace;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        white-space: pre;
      }
      .row { display: flex; align-items: center; gap: 8px; }
      button {
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 12px;
        font-weight: 600;
        color: var(--fg);
        background: var(--panel);
      }
      button:hover { border-color: var(--muted); }
      button.primary { background: var(--accent); border-color: var(--accent); }
      button.primary:hover { background: var(--accent-hover); }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { flex: 1; font-size: 12px; color: var(--muted); }
      #status.ok { color: var(--ok); }
      #status.err { color: var(--err); }
      #count { font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>Mercor Result Inspector</h1>
      <span id="page" title=""></span>
    </header>
    <main>
      <div class="options">
        <label><input type="checkbox" id="includeQc" checked /> Automation - QC</label>
        <label><input type="checkbox" id="includeHarbor" checked /> Harbor results</label>
        <label><input type="checkbox" id="includeRawJson" checked /> Include raw JSON output</label>
        <label><input type="checkbox" id="includeDescriptions" /> Include field descriptions</label>
        <label><input type="checkbox" id="includeOther" checked /> History / Metadata / Feedback</label>
        <label><input type="checkbox" id="expandCollapsed" checked /> Auto-expand collapsed sections</label>
      </div>
      <textarea id="preview" readonly spellcheck="false" placeholder="Extracting..."></textarea>
      <div class="row">
        <button id="copy" class="primary">Copy</button>
        <button id="refresh" title="Re-extract from the page">Refresh</button>
        <span id="status"></span>
        <span id="count"></span>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
